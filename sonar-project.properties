sonar.sourceEncoding=UTF-8

# Backend analysis only; frontend tests and assets have a separate toolchain.
sonar.sources=app.js,server.js,controllers,middleware,services,modals,routes,utils
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Generated by npm run test. Run the scanner from the repository root afterward.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

# Supply SONAR_HOST_URL and SONAR_TOKEN through your shell or CI secret settings.
